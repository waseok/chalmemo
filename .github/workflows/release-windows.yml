name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (예: v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: '찰메모 v__VERSION__'
          releaseBody: |
            상단 고정, 자동 업데이트, Windows 작업표시줄 표시를 개선했습니다.

            - Enter로 새 문단을 만들어도 고정 범위가 자동으로 늘어나지 않음
            - 고정 영역을 화면의 45%로 제한해 아래 입력 내용이 항상 보임
            - GitHub 릴리스 CDN이 막힌 환경을 위한 전용 업데이터 미러
            - Windows curl 우선 다운로드와 브라우저 다운로드 대체 경로
            - 자동 시작 후 창을 열 때 작업표시줄 아이콘 복구
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: chalmemo_[version]_x64-setup.exe

      - name: Upload ASCII installer name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" |
            Where-Object { $_.Name -notlike 'chalmemo*' } |
            Select-Object -First 1
          if (-not $src) {
            $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          }
          if (-not $src) { throw 'NSIS installer not found' }
          $version = $env:TAG.TrimStart('v')
          $dest = "src-tauri/target/release/bundle/nsis/chalmemo_${version}_x64-setup.exe"
          Copy-Item $src.FullName $dest -Force
          gh release upload $env:TAG $dest --clobber

      - name: Publish updater mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $installer = "src-tauri/target/release/bundle/nsis/chalmemo_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'ASCII installer not found' }
          $installerPath = (Resolve-Path -LiteralPath $installer).Path

          $mirror = Join-Path $env:RUNNER_TEMP 'chalmemo-updater-mirror'
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          Push-Location $mirror
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan updater
          Copy-Item -LiteralPath $installerPath -Destination "chalmemo_${version}_x64-setup.exe"
          git add .
          git commit -m "Publish updater installer v$version"
          gh auth setup-git
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin updater
          Pop-Location

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit $env:TAG --draft=false
