name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (예: v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: '찰메모 v__VERSION__'
          releaseBody: |
            인앱 자동 업데이트 종단 테스트용 릴리스입니다.

            - 0.1.8의 Windows 시스템 네트워크 다운로드 경로를 실제 업데이트로 검증합니다.
            - 기능은 0.1.8과 동일합니다.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: chalmemo_[version]_x64-setup.exe

      - name: Upload ASCII installer name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" |
            Where-Object { $_.Name -notlike 'chalmemo*' } |
            Select-Object -First 1
          if (-not $src) {
            $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          }
          if (-not $src) { throw 'NSIS installer not found' }
          $version = $env:TAG.TrimStart('v')
          $dest = "src-tauri/target/release/bundle/nsis/chalmemo_${version}_x64-setup.exe"
          Copy-Item $src.FullName $dest -Force
          gh release upload $env:TAG $dest --clobber
