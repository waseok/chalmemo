name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (예: v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: '찰메모 v__VERSION__'
          releaseBody: |
            링크 열기를 Windows 기본 브라우저 백엔드 호출로 교체했습니다.

            - 프런트엔드 플러그인 권한 경로를 우회해 Rust 백엔드에서 링크 열기
            - 링크 열기 요청·성공·실패를 앱 로그에 기록
            - 링크 열기 실패 시 오류 메시지를 화면에 표시
            - 링크 카드를 클릭하면 Windows 기본 브라우저로 열기
            - 본문에 자동 인식된 링크를 한 번 클릭해 열기
            - 상단 고정 문단 안의 링크도 클릭해 열기
            - 편집기의 선택 동작이 링크 카드 클릭을 가로채지 않도록 수정
            - GitHub 릴리스 설치 파일 주소를 자동 업데이트의 1순위로 사용
            - raw.githubusercontent.com 주소는 실패 시 보조 경로로 사용
            - 모든 자동 경로 실패 시에도 브라우저는 GitHub 릴리스 주소로 열기
            - 다른 앱에서 내용 선택 후 Ctrl+Alt+M 한 번으로 현재 메모에 바로 삽입
            - 단축키를 누른 순간에만 선택 내용을 자동 복사
            - 기존 클립보드를 미리 지우지 않고 Windows 변경 번호로 복사 성공 확인
            - 다른 화면 캡처 단축키와 겹치지 않도록 단축키 하나만 고정 등록
            - 저장한 내용을 같은 창에 다시 주입하던 동작 제거
            - 한글 조합·타이핑 중 편집기 본문 재생성 방지
            - 앱 시작 시 GitHub 자동 접속 제거
            - 업데이트는 설정의 「지금 확인」을 눌렀을 때만 조회
            - GitHub 릴리스 CDN이 막힌 환경을 위한 전용 업데이터 미러
            - Windows curl 우선 다운로드와 브라우저 다운로드 대체 경로
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: chalmemo_[version]_x64-setup.exe

      - name: Upload ASCII installer name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" |
            Where-Object { $_.Name -notlike 'chalmemo*' } |
            Select-Object -First 1
          if (-not $src) {
            $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          }
          if (-not $src) { throw 'NSIS installer not found' }
          $version = $env:TAG.TrimStart('v')
          $dest = "src-tauri/target/release/bundle/nsis/chalmemo_${version}_x64-setup.exe"
          Copy-Item $src.FullName $dest -Force
          gh release upload $env:TAG $dest --clobber

      - name: Publish updater mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $installer = "src-tauri/target/release/bundle/nsis/chalmemo_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'ASCII installer not found' }
          $installerPath = (Resolve-Path -LiteralPath $installer).Path

          $mirror = Join-Path $env:RUNNER_TEMP 'chalmemo-updater-mirror'
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          Push-Location $mirror
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan updater
          Copy-Item -LiteralPath $installerPath -Destination "chalmemo_${version}_x64-setup.exe"
          git add .
          git commit -m "Publish updater installer v$version"
          gh auth setup-git
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin updater
          Pop-Location

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit $env:TAG --draft=false
